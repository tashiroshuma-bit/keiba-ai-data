name: Settle 2026-11-08 all JRA v50 ABCD actual results
on:
  push:
    paths:
      - '.github/workflows/settle_v50_20261108_official_all.yml'
      - 'scripts/settle_v50_20261108_official_all.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Match 36 official JRA outcomes and evaluate frozen preoff ABCD odds
        run: python -m scripts.settle_v50_20261108_official_all
      - name: Preserve reproducible audited results and error diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations/results/2026-11-08/v50_abcd_settlement.json operations/results/2026-11-08/v50_abcd_settlement.md
          git commit -m "Save 2026-11-08 JRA outcomes against original and preoff odds v50 ABCD"
          git pull --rebase origin main
          git push
