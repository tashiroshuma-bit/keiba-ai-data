name: Inspect outsider top 3 data coverage
on:
  push:
    paths:
      - '.github/workflows/inspect_outsider_top3_sources.yml'
      - 'scripts/inspect_outsider_top3_sources.py'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m scripts.inspect_outsider_top3_sources
