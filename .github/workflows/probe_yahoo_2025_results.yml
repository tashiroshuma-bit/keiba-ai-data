name: Probe historical Yahoo result rows
on:
  push:
    paths:
      - '.github/workflows/probe_yahoo_2025_results.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python -m scripts.probe_yahoo_2025_results
