name: 2026-10-24 full-day retrospective baseline
on:
  push:
    paths:
      - '.github/workflows/forecast_20261024.yml'
      - 'scripts/forecast_20261024_fallback.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4
      - name: Download historical pre-race cards and calculate
        id: forecast
        continue-on-error: true
        run: python scripts/forecast_20261024_fallback.py
      - name: Save output and explicit failures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/20261024_manual_fallback
          if ! git diff --cached --quiet; then
            git commit -m "Store 2026-10-24 retrospective baseline and missing races"
            git push
          fi
      - name: Mark incomplete as failed
        if: steps.forecast.outcome == 'failure'
        run: exit 1
