name: Retrain historical 2025 horse residual and evaluate heldout dates
on:
  push:
    paths:
      - '.github/workflows/retrain_v50_horse_residual_shadow_2025.yml'
      - 'scripts/retrain_v50_horse_residual_shadow_2025.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - name: Fit multinomial conditional horse-level residual and inspect untouched 125-race holdout
        run: python -m scripts.retrain_v50_horse_residual_shadow_2025
      - name: Save fitted coefficients, validation and factual results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/v50_horse_residual_retrained_2025.json reports/v50_horse_residual_retrained_model_2025.json reports/v50_horse_residual_retrained_2025.md
          git commit -m "Save 2025 actual trained horse residual and untouched later-race evaluation"
          git pull --rebase origin main
          git push
