name: v50 weak-race shape diagnostics
on:
  push:
    paths:
      - '.github/workflows/diagnose_v50_weak_race_shapes.yml'
      - 'scripts/diagnose_v50_weak_race_shapes.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit race-specific model weaknesses with strict preoff features
        run: python -m scripts.diagnose_v50_weak_race_shapes
      - name: Commit weak race report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/v50_weak_race_diagnostics_20261108.md reports/v50_weak_race_diagnostics_20261108.json
          git commit -m "Persist historical and Nov8 v50 race-shape failure diagnostics"
          git pull --rebase origin main
          git push
