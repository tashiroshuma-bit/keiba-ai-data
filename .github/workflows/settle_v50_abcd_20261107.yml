name: Settle Nov 7 v50 ABCD and evaluate final odds
on:
  push:
    paths:
      - '.github/workflows/settle_v50_abcd_20261107.yml'
      - 'scripts/settle_v50_abcd_20261107.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Fetch November 7 actual results, compare A-D and final market odds
        id: settle
        continue-on-error: true
        run: python -m scripts.settle_v50_abcd_20261107
      - name: Persist partial or complete observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations/results/2026-11-07/v50_abcd_actual_results.json operations/results/2026-11-07/v50_abcd_actual_results_report.md || true
          if ! git diff --cached --quiet; then
            git commit -m "Save Nov 7 actual v50 ABCD forecast settlement"
            git pull --rebase origin main
            git push
          fi
      - name: Reject failed evaluation
        if: steps.settle.outcome == 'failure'
        run: exit 1
