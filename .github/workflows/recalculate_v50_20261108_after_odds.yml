name: Recalculate Nov 8 ABCD all marginals and tickets after odds
on:
  push:
    paths:
      - '.github/workflows/recalculate_v50_20261108_after_odds.yml'
      - 'scripts/recalculate_v50_20261108_after_odds.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fully recalculate all ranks and singles, quinellas, trios
        run: python -m scripts.recalculate_v50_20261108_after_odds
      - name: Save final model research tables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations/predictions/2026-11-08/v50_live_odds_full_tickets_1051.json operations/predictions/2026-11-08/v50_live_odds_full_tickets_1051.md
          git commit -m "Publish complete Nov 8 after-market PL tickets and ranking probabilities"
          git pull --rebase origin main
          git push
