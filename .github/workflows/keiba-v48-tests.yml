name: keiba-v48-tests

on:
  push:
    paths:
      - 'keiba_v48/**'
      - 'requirements.txt'
      - '.github/workflows/keiba-v48-tests.yml'
  pull_request:
    paths:
      - 'keiba_v48/**'
      - 'requirements.txt'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run v4.8 tests
        working-directory: keiba_v48
        run: python -m unittest discover -p 'test_*.py'
