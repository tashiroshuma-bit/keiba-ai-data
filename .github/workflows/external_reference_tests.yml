name: External AI reference tests
on:
  push:
    paths:
      - 'scripts/external_muryou_keiba_reference.py'
      - 'tests/test_external_muryou_keiba_reference.py'
      - '.github/workflows/external_reference_tests.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test external reference parser, pre-off gate, roster check
        run: python -m unittest discover -s tests -p 'test_external_muryou_keiba_reference.py' -v
