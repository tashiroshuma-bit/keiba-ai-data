name: Publish v50 ABCD per-race drilldown
on:
  push:
    paths:
      - '.github/workflows/publish_v50_abcd_drilldown.yml'
      - 'scripts/publish_v50_abcd_drilldown.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate 67 race detail pages
        run: python -m scripts.publish_v50_abcd_drilldown
      - name: Commit all drilldown reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations/predictions/2026-11-07/v50_drilldown
          git commit -m "Publish 67 race v50 ABCD drilldown reports"
          git pull --rebase origin main
          git push
