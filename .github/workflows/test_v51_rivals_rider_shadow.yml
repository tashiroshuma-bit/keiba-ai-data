name: V51 rival-quality and asof identity smoke tests
on:
  push:
    paths:
      - '.github/workflows/test_v51_rivals_rider_shadow.yml'
      - 'scripts/retrain_v51_rivals_rider_shadow.py'
      - 'tests/test_v51_rivals_rider_shadow.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy
      - name: Enforce V51 preoff horse-opponent-rider cutoff and missing identity policy
        run: python -m unittest discover -s tests -p 'test_v51_rivals_rider_shadow.py' -v
