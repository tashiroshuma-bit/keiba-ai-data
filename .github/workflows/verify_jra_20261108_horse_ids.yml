name: Verify JRA Nov 8 official full-runner horse IDs
on:
  push:
    paths:
      - '.github/workflows/verify_jra_20261108_horse_ids.yml'
      - 'scripts/collect_20261108_jra_horse_id_proofs.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Verify JRA official profile ID against exact race, horse name and number
        run: python -m scripts.collect_20261108_jra_horse_id_proofs
      - name: Save result proof and unavailable pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations/results/2026-11-08/jra_official_runner_identity_evidence.json
          git commit -m "Save official exact-runner 2026 Nov8 JRA horse ID evidence for DB reconciliation"
          git pull --rebase origin main
          git push
