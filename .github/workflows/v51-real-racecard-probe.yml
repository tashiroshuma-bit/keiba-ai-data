name: V51 actual preoff JRA racecard probe
on:
  pull_request:
    paths:
      - '.github/workflows/v51-real-racecard-probe.yml'
      - 'scripts/v51_jra_racecard_capture.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-racecard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 lxml
      - name: Probe actual official 2026-11-15 Kyoto 11R preoff
        run: |
          mkdir -p /tmp/v51-real-racecard
          python scripts/v51_jra_racecard_capture.py \
            --url 'https://sp.jra.jp/JRADB/accessD.html?CNAME=sw01ddd0108202605041120261115%2F13' \
            --output-dir /tmp/v51-real-racecard
      - name: Diagnose official horse and jockey anchor encoding
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import re
          p=Path('/tmp/v51-real-racecard/source.html')
          if not p.exists(): raise SystemExit('source missing')
          soup=BeautifulSoup(p.read_bytes(),'lxml')
          print('source_bytes',p.stat().st_size,'tables',len(soup.select('table')))
          links=soup.select('a[href],a[onclick]')
          print('total_anchors',len(links))
          for a in links:
            txt=a.get_text(' ',strip=True)
            raw=(a.get('href','')+' '+a.get('onclick',''))
            if any(s in txt for s in ('カムニャック','川田','ラヴァンダ','ジュウリョクピエロ')):
              print('MATCH',repr(txt[:60]),repr(raw[:300]),'parent',a.parent.name)
          for a in links:
            if 'sj01ude00' in str(a.get('href','')) and a.get_text(' ',strip=True):
              parent=a
              for _ in range(5): parent=parent.parent if parent.parent else parent
              print('ROW_CELLS',[(td.get('class'),td.get_text(' ',strip=True)[:90]) for td in parent.find_all('td',recursive=False)]);break
          for pattern in ('pw01','pw04','CNAME','horse','jockey'):
            print('pattern',pattern,'count',len(re.findall(pattern,str(soup),re.I)))
          PY
      - name: Archive evidence on success or refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-jra-preoff-probe
          path: /tmp/v51-real-racecard/
          if-no-files-found: warn
