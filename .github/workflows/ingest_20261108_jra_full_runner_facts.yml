name: Ingest JRA November 8 all-runner official historic facts
on:
  push:
    paths:
      - '.github/workflows/ingest_20261108_jra_full_runner_facts.yml'
      - 'scripts/collect_20261108_official_runner_facts.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Validate official JRA 36-race facts with frozen complete horse roster
        run: python -m scripts.collect_20261108_official_runner_facts
      - name: Persist historical facts and independently check SQLite
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations/data_updates/jra_nov08_full_runner_facts_20261108.json operations/data_updates/jra_nov08_postrace_facts_20261108.sqlite reports/v51/JRA_NOV08_FULL_RUNNER_FACTS_AUDIT.md
          git commit -m "Save source-backed JRA postrace full runner historical facts as new companion DB"
          git pull --rebase origin main
          git push
