name: v4.8 tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keiba-v48-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/project_status.py
      - run: python -m unittest discover -s scripts -p 'test_v50_promotion_gate.py' -v
      - run: python -m unittest discover -s tests -p 'test_v50*.py' -v
      - name: Historical v50 actual paired calibration (Oct31 selection, Nov01 evaluation)
        run: python scripts/v50_two_day_real_calibration.py > v50_two_day_results.json && cat v50_two_day_results.json
      - name: Actual historical rider blend-weight sensitivity grid
        run: python -m scripts.v50_weight_sensitivity > v50_weight_sensitivity.json && cat v50_weight_sensitivity.json
      - run: python -m unittest discover -s scripts -p 'test_*jockey*.py' -v
      - run: python -m unittest discover -s scripts -p 'test_preoff_body_weight.py' -v
      - name: Run pre-off paired v50/weight capture and shadow research tests
        run: python -m unittest discover -s tests -p 'test_capture_v50_bodyweight.py' -v && python -m unittest discover -s tests -p 'test_evaluate_v50_v51_weight_pairs.py' -v && python -m unittest discover -s tests -p 'test_v51_body_weight_shadow.py' -v && python -m unittest discover -s tests -p 'test_body_weight_audit.py' -v
      - run: python -m unittest discover -s scripts -p 'test_refresh_sunday.py' -v
      - name: Synthetic full CLI round-trip, never classified as official performance
        run: python -m unittest discover -s tests -p 'test_v51_pair_cli_smoke.py' -v
      - name: V51 research feature, podium and weekend preflight regressions
        run: python -m unittest discover -s tests -p 'test_v51_research_diagnostics.py' -v && python -m unittest discover -s tests -p 'test_v51_weekend_preflight.py' -v
      - name: V51 official ID sidecar evidence and conflict rejection
        run: python -m unittest discover -s tests -p 'test_v51_identity_sidecar.py' -v
      - name: Point-in-time v51 research feature creation
        run: python -m unittest discover -s tests -p 'test_v51_preoff_feature_builder.py' -v
      - name: Preflight demonstrates missing live inputs are NOT READY
        run: python -m scripts.v51_weekend_preflight --repo . > /tmp/v51_preflight.json && python -c 'import json; d=json.load(open("/tmp/v51_preflight.json")); assert d["status"] == "NOT_READY" and not d["checks"]["canonical_db_present"]'

      - run: python -m unittest discover -s keiba_v48 -v
      - run: python -m compileall -q keiba_v48

  legacy-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r research/requirements.txt
      - name: Test imported diagnostic modules
        working-directory: research/legacy_20261007
        run: python -m unittest -v test_joint_top3_model.py test_ticket_math.py
