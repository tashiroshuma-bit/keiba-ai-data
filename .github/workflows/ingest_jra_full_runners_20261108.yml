name: Ingest official JRA full runner history Nov 8 with provenance
on:
  push:
    paths:
      - '.github/workflows/ingest_jra_full_runners_20261108.yml'
      - 'scripts/ingest_jra_official_full_runners_20261108.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Fetch exact JRA official full race results and build validated supplementary SQLite
        run: python -m scripts.ingest_jra_official_full_runners_20261108
      - name: Reopen SQLite and verify integrity, size and SHA256
        run: |
          python - <<'PY'
          import hashlib,json,sqlite3
          from pathlib import Path
          p=Path("operations/data_updates/jra_official_full_runner_history_20261108_v2.sqlite")
          a=json.loads(Path("operations/data_updates/jra_official_full_runner_history_20261108_v2_audit.json").read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==a["sqlite_sha256"]
          assert p.stat().st_size==a["sqlite_size_bytes"]
          c=sqlite3.connect(f"file:{p.resolve()}?mode=ro",uri=True)
          assert c.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          assert not c.execute("PRAGMA foreign_key_check").fetchall()
          n=c.execute("SELECT count(*) FROM source_runner").fetchone()[0]
          assert n==a["counts"]["runners"] and n>0
          assert c.execute("SELECT count(*) FROM source_runner WHERE preoff_usable_for_same_race!=0").fetchone()[0]==0
          print("verified full-runner rows",n)
          PY
      - name: Commit verified race history, diagnostics and no-data quarantine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations/data_updates/jra_official_full_runner_history_20261108_v2.sqlite operations/data_updates/jra_official_full_runner_history_20261108_v2_audit.json reports/v51/JRA_20261108_FULL_RUNNER_HISTORY_ENRICHMENT_V2.md
          git commit -m "Save JRA official postrace runner history with complete integrity and source checks"
          git pull --rebase origin main
          git push
