name: Run Nov 7-8 v50 research forecasts
on:
  push:
    paths:
      - '.github/workflows/v50_forecast_20261107_08.yml'
      - 'scripts/forecast_20261107_08_v50_research.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy beautifulsoup4
      - name: Run 72-card source validation and v50 research probabilities
        id: prediction
        continue-on-error: true
        run: python -m scripts.forecast_20261107_08_v50_research
      - name: Persist results even if incomplete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations/predictions/2026-11-07/v50_weekend_research.json operations/predictions/2026-11-07/v50_weekend_research_summary.md || true
          if ! git diff --cached --quiet; then
            git commit -m "Persist Nov 7-8 v50 research predictions and failures"
            git pull --rebase origin main
            git push
          fi
      - name: Fail closed if research could not run
        if: steps.prediction.outcome == 'failure'
        run: exit 1
