name: 2026-10-30 weekend preoff four-model freeze
on:
  push:
    paths:
      - 'scripts/forecast_20261031_1101_four_model.py'
      - 'scripts/test_weekend_full_roster.py'
      - '.github/workflows/weekend_preoff_20261030.yml'
  workflow_dispatch:
concurrency:
  group: weekend-roster-repair
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependencies
        run: python -m pip install beautifulsoup4 numpy
      - name: Test full roster parser
        run: python scripts/test_weekend_full_roster.py
      - name: Probe actual full rosters
        run: python scripts/forecast_20261031_1101_four_model.py --probe
      - name: Freeze weekend research prediction
        run: python scripts/forecast_20261031_1101_four_model.py
      - name: Save immutable prediction files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add operations/predictions/2026-10-31 operations/predictions/2026-11-01
          git diff --cached --quiet || (git commit -m "Freeze Oct 31 and Nov 1 preoff research predictions" && git pull --rebase origin main && git push)
