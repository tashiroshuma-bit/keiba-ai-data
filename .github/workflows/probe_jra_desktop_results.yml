name: Probe JRA official desktop result all runner fields
on:
  push:
    paths:
      - '.github/workflows/probe_jra_desktop_results.yml'
      - 'scripts/probe_official_jra_desktop_results.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Inspect verified JRA full-runner result table
        run: python -m scripts.probe_official_jra_desktop_results
      - name: Save exact HTML schema proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations/data_updates/jra_desktop_result_html_probe_20261108.json
          git commit -m "Save JRA official full runner result page inspection"
          git pull --rebase origin main
          git push
