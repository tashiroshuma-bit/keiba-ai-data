name: Publish Nov 8 v50 ABCD official runner audit
on:
  push:
    paths:
      - '.github/workflows/publish_20261108_v50_post_odds_study.yml'
      - 'scripts/publish_20261108_v50_post_odds_study.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy beautifulsoup4
      - name: Re-verify each Nov 8 JRA runner number/name and render all models
        run: python -m scripts.publish_20261108_v50_post_odds_study
      - name: Commit official-checked study
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations/predictions/2026-11-08/v50_abcd_official_card_audit.json operations/predictions/2026-11-08/v50_abcd_post_historical_review.md
          git commit -m "Save official-checked Nov 8 A-D race rankings and conditional p3 study"
          git pull --rebase origin main
          git push
