name: Recover Oct 31 obstacle full roster
on:
  push:
    paths:
      - 'scripts/recover_20261031_obstacle_roster.py'
      - '.github/workflows/recover_20261031_obstacle_roster.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4 numpy
      - run: python scripts/recover_20261031_obstacle_roster.py
      - name: Save immutable recovered roster
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add operations/predictions/2026-10-31/obstacle_roster_recovery_*.json
          git diff --cached --quiet || (git commit -m "Save independently verified Oct 31 obstacle roster" && git pull --rebase origin main && git push)
