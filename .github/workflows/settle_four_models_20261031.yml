name: 2026-10-31 official four-model settlement
on:
  push:
    paths:
      - 'scripts/settle_four_models.py'
      - '.github/workflows/settle_four_models_20261031.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4
      - name: Verify JRA official results and settle immutable tickets
        run: python scripts/settle_four_models.py
      - name: Commit immutable settlement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add operations/results/2026-10-31 reports/review_20261031
          git diff --cached --quiet || (git commit -m "Settle Oct 31 four-model forecasts against JRA official results" && git push)
