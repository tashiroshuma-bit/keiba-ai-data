name: Add official JRA Tokyo11 and Tokyo12 horse prior histories
on:
  push:
    paths:
      - '.github/workflows/ingest_jra_tokyo11_12_profiles.yml'
      - 'scripts/ingest_jra_tokyo11_12_official_profiles.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - name: Ingest bounded race runner horse histories and exact JRA profile links
        run: python -m scripts.ingest_jra_tokyo11_12_official_profiles
      - name: Store immutable source-backed postrace profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations/data_updates/jra_official_20261108_tokyo11_12_profiles_v1.sqlite operations/data_updates/jra_official_20261108_tokyo11_12_profiles_v1_audit.json
          git commit -m "Preserve real JRA horse prior-running records for Tokyo11 and Tokyo12"
          git pull --rebase origin main
          git push
