name: v4.8 tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keiba-v48-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/project_status.py
      - run: python -m unittest discover -s scripts -p 'test_v50_promotion_gate.py' -v
      - run: python -m unittest discover -s tests -p 'test_v50*.py' -v
      - name: Historical v50 actual paired calibration (Oct31 selection, Nov01 evaluation)
        run: python scripts/v50_two_day_real_calibration.py > v50_two_day_results.json && cat v50_two_day_results.json
      - name: Actual historical rider blend-weight sensitivity grid
        run: python -m scripts.v50_weight_sensitivity > v50_weight_sensitivity.json && cat v50_weight_sensitivity.json
      - run: python -m unittest discover -s scripts -p 'test_*jockey*.py' -v
      - run: python -m unittest discover -s scripts -p 'test_preoff_body_weight.py' -v
      - name: Run pre-off paired v50/weight capture and shadow research tests
        run: python -m unittest discover -s tests -p 'test_capture_v50_bodyweight.py' -v && python -m unittest discover -s tests -p 'test_evaluate_v50_v51_weight_pairs.py' -v && python -m unittest discover -s tests -p 'test_v51_body_weight_shadow.py' -v && python -m unittest discover -s tests -p 'test_body_weight_audit.py' -v
      - run: python -m unittest discover -s scripts -p 'test_refresh_sunday.py' -v
      - name: Synthetic full CLI round-trip, never classified as official performance
        run: python -m unittest discover -s tests -p 'test_v51_pair_cli_smoke.py' -v
      - name: V51 research feature, podium and weekend preflight regressions
        run: python -m unittest discover -s tests -p 'test_v51_research_diagnostics.py' -v && python -m unittest discover -s tests -p 'test_v51_weekend_preflight.py' -v
      - name: V51 official ID sidecar evidence and conflict rejection
        run: python -m unittest discover -s tests -p 'test_v51_identity_sidecar.py' -v
      - name: Historical JRA official horse ID profile reconstruction guard
        run: python -m unittest discover -s tests -p 'test_horse_id_profile_recovery.py' -v
      - name: Verify JRA original source ZIP against immutable canonical race and horse IDs
        run: python -m unittest discover -s tests -p 'test_jra_reconcile_official_source_archives.py' -v
      - name: JRA 1975 reviewed-race primary-source PDF and alias regression
        run: python -m unittest discover -s tests -p 'test_jra_review_evidence_v2.py' -v
      - name: Point-in-time v51 research feature creation
        run: python -m unittest discover -s tests -p 'test_v51_preoff_feature_builder.py' -v
      - name: Paired conditional second and third rank evaluation
        run: python -m unittest discover -s tests -p 'test_v51_conditional_rank_pair_evaluation.py' -v
      - name: V51 prospective overconfidence and calibration diagnostics
        run: python -m unittest discover -s tests -p 'test_v51_calibration_audit.py' -v
      - name: Full weekend integrated v50 plus research shadow and official result regression
        run: python -m unittest discover -s tests -p 'test_v51_weekend_integrated_runner.py' -v && python -m unittest discover -s tests -p 'test_v51_weekend_postrace_runner.py' -v
      - name: V51 v12 conditional p1 p2 p3 same source A and 2026 heldout report
        run: python -m unittest discover -s tests -p 'test_v51_recovered_id_rank.py' -v && python -m unittest discover -s tests -p 'test_v51_recovered_id_real_report.py' -v
      - name: Official V51 active three-stage forecast source proof and 2025-only calibration
        run: python -m unittest discover -s tests -p 'test_v51_official_forecast.py' -v && python -m unittest discover -s tests -p 'test_v51_calibration_refinement.py' -v
      - name: V51 2025 chronological coefficient sensitivity and calibration grid unit gates
        run: python -m unittest discover -s tests -p 'test_v51_2025_coefficient_calibration_grid.py' -v
      - name: Official V51 point-in-time inference unit gates
        run: python -m unittest discover -s tests -p 'test_v51_official_forecast.py' -v
      - name: Reconcile 2025 and 2026 V51 real selective-ranking hit counts
        run: python -m unittest discover -s tests -p 'test_v51_selective_accuracy_audit.py' -v && python -m scripts.v51_rank_selective_accuracy_audit > /tmp/v51_real_rank_selectivity.json
      - name: V51 learned conditional second third rank ridge and joint podium checks
        run: python -m unittest discover -s tests -p 'test_v51_2025_conditional_p2p3_ridge.py' -v
      - name: Guard actual 2025/2026 V51 real rank ablation coefficients and no-promotion decision
        run: python -m unittest discover -s tests -p 'test_v51_real_rank_ablation_artifact.py' -v
      - name: V51 official four-axis previous-race class style rider and announced-weight provenance gates
        run: python -m unittest discover -s tests -p 'test_v51_four_axis_preoff_research.py' -v && python -m unittest discover -s tests -p 'test_v51_four_axis_canonical_coverage.py' -v
      - name: V51 real-date embargo prior class/style/jockey/past weight and additive rank fit tests
        run: python -m unittest discover -s tests -p 'test_v51_four_axis_historical_features.py' -v && python -m unittest discover -s tests -p 'test_v51_four_axis_rank_residual_study.py' -v
      - name: Audit checked-in 2026 JRA history SQLite schema for four-axis coverage
        run: python -m scripts.v51_repository_source_schema_probe
      - name: Real JRA 497-runner observed Nov08 history for later-race style and bodyweight features
        run: python -m unittest discover -s tests -p 'test_v51_real_20261108_next_start_history_audit.py' -v && python -m scripts.v51_real_20261108_next_start_history_audit
      - name: Verify 14 V51 four-axis features from canonical-shaped SQLite and two-day history embargo
        run: python -m unittest discover -s tests -p 'test_v51_fouraxis_canonical_sqlite_integration.py' -v
      - name: Guard four-axis 2025 2026 ordered podium rate and annual source feature coverage scoring
        run: python -m unittest discover -s tests -p 'test_v51_fouraxis_fullscore_integrity.py' -v
      - name: Preflight demonstrates missing live inputs are NOT READY
        run: python -m scripts.v51_weekend_preflight --repo . > /tmp/v51_preflight.json && python -c 'import json; d=json.load(open("/tmp/v51_preflight.json")); assert d["status"] == "NOT_READY" and not d["checks"]["canonical_db_present"]'

      - name: Limited live JRA official race/profile access probe (non-blocking)
        run: python -m scripts.jra_official_horse_bulk_probe --output /tmp/jra_id_probe.json
      - run: python -m unittest discover -s keiba_v48 -v
      - run: python -m compileall -q keiba_v48

  legacy-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r research/requirements.txt
      - name: Test imported diagnostic modules
        working-directory: research/legacy_20261007
        run: python -m unittest -v test_joint_top3_model.py test_ticket_math.py
