name: Probe JRA official horse profile pedigree and past-runs
on:
  push:
    paths:
      - '.github/workflows/probe_jra_official_horse_profile.yml'
      - 'scripts/probe_official_jra_horse_profile.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4
      - run: python -m scripts.probe_official_jra_horse_profile
      - name: Save official pedigree layout and source SHA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations/data_updates/jra_official_horse_profile_html_probe_20261108.json
          git commit -m "Save official horse pedigree and past-runs structure audit"
          git pull --rebase origin main
          git push
