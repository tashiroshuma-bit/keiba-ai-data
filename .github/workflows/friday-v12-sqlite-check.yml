name: Friday canonical SQLite access check (no Python)
on:
  workflow_dispatch:
  push:
    branches: [feature/friday-historical-source-audit-20261116]
    paths:
      - '.github/workflows/friday-v12-sqlite-check.yml'
      - 'scripts/friday_v12_sqlite_check.sh'
permissions:
  contents: read
jobs:
  canonical-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify sqlite3 CLI
        run: |
          set -euo pipefail
          command -v sqlite3
          sqlite3 --version
      - name: Check for canonical source and audit read-only
        env:
          CANONICAL_DB: ${{ github.workspace }}/private-data/jra_2023_2025_v12_horse_ids_full_20261111.sqlite
        run: bash scripts/friday_v12_sqlite_check.sh
      - name: Upload audit results even on missing source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friday-v12-source-audit
          path: reports/friday_source_audit/
          if-no-files-found: warn
