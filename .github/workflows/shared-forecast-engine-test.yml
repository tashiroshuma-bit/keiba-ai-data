name: Shared forecast and backtest JS
on:
  push:
    paths:
      - 'research/shared_forecast_engine*'\n      - 'research/replay_canonical_jsonl*'\n      - 'research/predict_v51_js*'\n      - 'research/v51_joint_js.mjs'
      - '.github/workflows/shared-forecast-engine-test.yml'
  pull_request:
    paths:
      - 'research/shared_forecast_engine*'\n      - 'research/replay_canonical_jsonl*'\n      - 'research/predict_v51_js*'\n      - 'research/v51_joint_js.mjs'
      - '.github/workflows/shared-forecast-engine-test.yml'
jobs:
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test research/*.test.mjs
