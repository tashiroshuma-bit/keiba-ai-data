name: Audit JRA versus external race card headcount
on:
  push:
    paths:
      - '.github/workflows/audit_jra_multisource_cards.yml'
      - 'scripts/audit_jra_multisource_race_card_conflicts.py'
      - 'operations/data_updates/multisource_20261108_manual_observations.json'
      - 'tests/test_jra_multisource_race_conflicts.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test race card source conflict quarantine
        run: python -m unittest discover -s tests -p 'test_jra_multisource_race_conflicts.py' -v
      - name: Audit known JRA versus netkeiba field discrepancy
        run: python -m scripts.audit_jra_multisource_race_card_conflicts
      - name: Commit verified JRA external snapshot mismatch report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/v51/multisource_race_conflict_audit_20261108.json reports/v51/multisource_race_conflict_audit_20261108.md
          git commit -m "Flag unsupported JRA netkeiba runner count mismatch for manual source review"
          git pull --rebase origin main
          git push
