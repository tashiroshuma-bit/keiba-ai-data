name: Reconnect Nov 7-8 v50 BCD
on:
  push:
    paths:
      - '.github/workflows/v50_reconnect_abcd_20261107_08.yml'
      - 'scripts/reconnect_v50_abcd_20261107_08.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconnect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy beautifulsoup4
      - name: Reconnect and validate external full-field B C D probabilities
        id: calculate
        continue-on-error: true
        run: python -m scripts.reconnect_v50_abcd_20261107_08
      - name: Save complete results or reasons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operations/predictions/2026-11-07/v50_weekend_abcd_reconnected.json operations/predictions/2026-11-07/v50_weekend_abcd_report.md || true
          if ! git diff --cached --quiet; then
            git commit -m "Persist Nov 7-8 v50 ABCD reconnection results"
            git pull --rebase origin main
            git push
          fi
      - name: Mark failures
        if: steps.calculate.outcome == 'failure'
        run: exit 1
